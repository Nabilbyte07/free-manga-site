<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Manga Hunt</title>
  
  <!-- সিকিউরিটি চেক: এটি সবার আগে লোড হবে -->
  <script>
    if (localStorage.getItem('adminAccess') !== 'granted') {
      // replace ব্যবহার করলে কেউ Back বাটন দিয়েও ফিরতে পারবে না
      window.location.replace('login.html'); 
    }
    
    function logoutAdmin() {
      localStorage.removeItem('adminAccess');
      window.location.replace('login.html');
    }
  </script>

  <!-- আপনার বাকি CSS স্টাইলগুলো এর নিচে থাকবে... -->
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Sidebar Styling */
    .sidebar {
      width: 250px;
      background-color: #111111;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      padding-top: 20px;
    }
    .sidebar h2 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 30px;
    }
    .nav-item {
      padding: 15px 20px;
      cursor: pointer;
      border-bottom: 1px solid #222;
      transition: background 0.2s;
    }
    .nav-item:hover {
      background-color: #222;
      color: #38bdf8;
    }
    
    /* Main Content Styling */
    .main-content {
      flex-grow: 1;
      padding: 30px;
      overflow-y: auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
      margin-bottom: 30px;
    }
    
    /* Dashboard Cards */
    .card-container {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }
    .card {
      background-color: #111111;
      padding: 20px;
      border-radius: 8px;
      flex: 1;
      border: 1px solid #222;
      text-align: center;
    }
    .card h3 {
      margin: 0;
      color: #888;
      font-size: 1rem;
    }
    .card p {
      font-size: 2rem;
      margin: 10px 0 0 0;
      font-weight: bold;
      color: #38bdf8;
    }

    /* Action Section */
    .action-panel {
      background-color: #111111;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #222;
    }
    .action-panel input, .action-panel textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      background-color: #000;
      border: 1px solid #333;
      color: #fff;
      border-radius: 5px;
      box-sizing: border-box;
    }
    .btn {
      background-color: #38bdf8;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn:hover {
      background-color: #0ea5e9;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>MH Admin</h2>
    <div class="nav-item">📊 Dashboard Overview</div>
    <div class="nav-item">📚 Manage Manga</div>
    <div class="nav-item">💰 Ad Settings</div>
    <div class="nav-item">⚙️ Site Settings</div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <h1>Welcome, Admin</h1>
      <button class="btn" style="background-color: #ef4444; color: white;">Logout</button>
    </div>

    <!-- Stats -->
    <div class="card-container">
      <div class="card">
        <h3>Total Visitors (Mock)</h3>
        <p>1,204</p>
      </div>
      <div class="card">
        <h3>Custom Uploads</h3>
        <p>0</p>
      </div>
      <div class="card">
        <h3>Ad Revenue Clicks</h3>
        <p>45</p>
      </div>
    </div>

    <!-- Upload/Settings Panel -->
    <div class="action-panel">
      <h2>Update Banner Image URL</h2>
      <p style="color: #888; font-size: 0.9rem;">(পরবর্তীতে ডেটাবেস কানেক্ট করলে এই লিংকটি সেভ হয়ে মেইন ওয়েবসাইটে আপডেট হবে)</p>
      <input type="text" placeholder="https://example.com/new-banner.jpg">
      
      <h2>Update Top Ad Script</h2>
      <textarea rows="4" placeholder="Paste Adsterra / HilltopAds script here..."></textarea>
      
      <button class="btn">Save Changes</button>
    </div>
  </div>

</body>
</html>

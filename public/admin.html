<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Daily Dhikr</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      margin-bottom: 30px;
    }
    h2 { color: #34d399; margin-top: 0; text-align: center; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #cbd5e1; }
    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }
    textarea { height: 100px; resize: vertical; }
    .arabic-input { font-family: 'Amiri', serif; font-size: 1.5rem; text-align: right; }
    .btn-container { display: flex; gap: 10px; }
    button {
      flex: 1;
      padding: 12px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #059669; }
    .cancel-btn { background: #64748b; display: none; }
    .cancel-btn:hover { background: #475569; }
    
    .dua-list-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dua-info { font-weight: 600; color: #e2e8f0; }
    .action-btns { display: flex; gap: 8px; }
    .edit-btn { background: #3b82f6; padding: 6px 12px; font-size: 0.9rem; }
    .edit-btn:hover { background: #2563eb; }
    .delete-btn { background: #ef4444; padding: 6px 12px; font-size: 0.9rem; }
    .delete-btn:hover { background: #dc2626; }
    .back-link { display: block; text-align: center; margin-top: 20px; color: #94a3b8; text-decoration: none; }
    .back-link:hover { color: white; }
  </style>
  <script>
    if (localStorage.getItem('adminAccess') !== 'granted') {
      window.location.replace('login.html');
    }
  </script>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2 id="formTitle">Add New Dua</h2>
      <form onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="editIndex" value="-1">
        <div class="form-group">
          <label>Dua Title</label>
          <input type="text" id="duaTitle" required placeholder="Enter title...">
        </div>
        <div class="form-group">
          <label>Arabic Text (আরবি)</label>
          <textarea id="duaArabic" class="arabic-input" required placeholder="القرآن..."></textarea>
        </div>
        <div class="form-group">
          <label>Translation & Meaning (অনুবাদ)</label>
          <textarea id="duaTranslation" required placeholder="Write translation..."></textarea>
        </div>
        <div class="form-group">
          <label>Reference (রেফারেন্স)</label>
          <input type="text" id="duaReference" required placeholder="e.g. Sahih Al-Bukhari">
        </div>
        <div class="btn-container">
          <button type="submit" id="submitBtn">Publish Dua</button>
          <button type="button" id="cancelBtn" class="cancel-btn" onclick="resetForm()">Cancel</button>
        </div>
      </form>
    </div>

    <h2>Manage Duas</h2>
    <div id="adminDuaList"></div>
    <a href="index.html" class="back-link">← Go to Website</a>
  </div>

  <script>
    function loadDuas() {
      let list = JSON.parse(localStorage.getItem('customDuas')) || [];
      let container = document.getElementById('adminDuaList');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #94a3b8;">No custom duas added yet.</p>';
        return;
      }

      list.forEach((dua, index) => {
        container.innerHTML += `
          <div class="dua-list-item">
            <span class="dua-info">${dua.title}</span>
            <div class="action-btns">
              <button class="edit-btn" onclick="editDua(${index})">Edit</button>
              <button class="delete-btn" onclick="deleteDua(${index})">Delete</button>
            </div>
          </div>`;
      });
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      let editIndex = document.getElementById('editIndex').value;
      
      let duaData = {
        title: document.getElementById('duaTitle').value,
        arabic: document.getElementById('duaArabic').value,
        translation: document.getElementById('duaTranslation').value,
        reference: document.getElementById('duaReference').value
      };

      let list = JSON.parse(localStorage.getItem('customDuas')) || [];

      if (editIndex === "-1") {
        // নতুন দোয়া যোগ করা
        list.push(duaData);
        alert('Dua published successfully!');
      } else {
        // আগের দোয়া আপডেট করা
        list[editIndex] = duaData;
        alert('Dua updated successfully!');
        resetForm();
      }

      localStorage.setItem('customDuas', JSON.stringify(list));
      e.target.reset();
      loadDuas();
    }

    function editDua(index) {
      let list = JSON.parse(localStorage.getItem('customDuas'));
      let dua = list[index];

      document.getElementById('duaTitle').value = dua.title;
      document.getElementById('duaArabic').value = dua.arabic;
      document.getElementById('duaTranslation').value = dua.translation;
      document.getElementById('duaReference').value = dua.reference;
      
      document.getElementById('editIndex').value = index;
      document.getElementById('formTitle').innerText = "Edit Dua";
      document.getElementById('submitBtn').innerText = "Update Dua";
      document.getElementById('cancelBtn').style.display = "block";
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('editIndex').value = "-1";
      document.getElementById('formTitle').innerText = "Add New Dua";
      document.getElementById('submitBtn').innerText = "Publish Dua";
      document.getElementById('cancelBtn').style.display = "none";
      document.querySelector('form').reset();
    }

    function deleteDua(index) {
      if (confirm('Are you sure you want to delete this dua?')) {
        let list = JSON.parse(localStorage.getItem('customDuas'));
        list.splice(index, 1);
        localStorage.setItem('customDuas', JSON.stringify(list));
        loadDuas();
        resetForm();
      }
    }

    loadDuas();
  </script>
</body>
</html>

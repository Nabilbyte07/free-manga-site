<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Daily Dhikr</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h2 { color: #34d399; margin-top: 0; text-align: center; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #cbd5e1; }
    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }
    textarea { height: 100px; resize: vertical; }
    .arabic-input { font-family: 'Amiri', serif; font-size: 1.5rem; text-align: right; }
    button {
      width: 100%;
      padding: 12px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #059669; }
    .back-link { display: block; text-align: center; margin-top: 20px; color: #94a3b8; text-decoration: none; }
    .back-link:hover { color: white; }
  </style>
  <script>
    // সিকিউরিটি চেক: পাসওয়ার্ড দেওয়া না থাকলে লগইন পেজে পাঠাবে
    if (localStorage.getItem('adminAccess') !== 'granted') {
      window.location.replace('login.html');
    }
  </script>
</head>
<body>

  <div class="card">
    <h2>Add New Dua</h2>
    <form onsubmit="saveDua(event)">
      <div class="form-group">
        <label>Dua Title (যেমন: Morning Dua)</label>
        <input type="text" id="duaTitle" required placeholder="Enter title...">
      </div>
      <div class="form-group">
        <label>Arabic Text (আরবি)</label>
        <textarea id="duaArabic" class="arabic-input" required placeholder="القرآن..."></textarea>
      </div>
      <div class="form-group">
        <label>Translation & Meaning (অনুবাদ)</label>
        <textarea id="duaTranslation" required placeholder="Write translation..."></textarea>
      </div>
      <div class="form-group">
        <label>Reference (রেফারেন্স)</label>
        <input type="text" id="duaReference" required placeholder="e.g. Sahih Al-Bukhari">
      </div>
      <button type="submit">Publish Dua</button>
    </form>
    <a href="index.html" class="back-link">← Go to Website</a>
  </div>

  <script>
    function saveDua(e) {
      e.preventDefault();
      
      let newDua = {
        title: document.getElementById('duaTitle').value,
        arabic: document.getElementById('duaArabic').value,
        translation: document.getElementById('duaTranslation').value,
        reference: document.getElementById('duaReference').value
      };

      // আগের দোয়াগুলোর সাথে নতুন দোয়াটি যোগ করা
      let existingDuas = JSON.parse(localStorage.getItem('customDuas')) || [];
      existingDuas.push(newDua);
      localStorage.setItem('customDuas', JSON.stringify(existingDuas));

      alert('Dua published successfully!');
      e.target.reset();
    }
  </script>
</body>
</html>

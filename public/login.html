<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Daily Dhikr</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 300px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 15px 0;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: white;
      box-sizing: border-box;
      outline: none;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #059669; }
    .error { color: #f87171; font-size: 0.9rem; display: none; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <input type="password" id="passwordInput" placeholder="Enter Password">
    <div id="errorMsg" class="error">Incorrect Password!</div>
    <button onclick="checkLogin()">Login</button>
  </div>

  <script>
    function checkLogin() {
      let pass = document.getElementById('passwordInput').value;
      // এখানে পাসওয়ার্ড 'admin123' দেওয়া আছে, আপনি চাইলে চেঞ্জ করে নিতে পারেন
      if (pass === 'Nabil0506') {
        localStorage.setItem('adminAccess', 'granted');
        window.location.replace('admin.html');
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    }
  </script>
</body>
</html>
